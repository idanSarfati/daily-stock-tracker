name: Daily Stock Update

on:
  schedule:
    # Mon–Thu: 20:00 UTC ≈ 22:00 Israel (winter) / 23:00 Israel (summer)
    - cron: "0 20 * * 1-4"
    # Sat: 16:20 UTC = 18:20 Israel (יציאת שבת, winter) — nudge ~10 min later each few weeks as season shifts
    - cron: "20 16 * * 6"
  workflow_dispatch:

jobs:
  run-daily-script:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Optional: define this as a GitHub Actions Variable named "TICKERS"
      # so you can update the list without code changes.
      TICKERS: ${{ vars.TICKERS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily script
        run: python daily_script.py


